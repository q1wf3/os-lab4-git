---
- name: Configure local Linux environment
  hosts: local
  become: true
  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Create web page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "<h1>Инфраструктура настроена через Ansible (IaC)</h1>\n"
        owner: root
        group: root
        mode: '0644'
    - name: Enable and start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
